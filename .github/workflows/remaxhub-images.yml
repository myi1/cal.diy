# REMAX Hub: build the web and API v2 images for book.remaxhub.ae and push them to GHCR.
# Builds run here, never on the Coolify host (the web build needs ~8 GB RAM).
# Tags: sha-<short sha> (what Coolify pins) and remaxhub (moving pointer, never deployed directly).
name: "REMAX Hub images"

on:
  workflow_dispatch:
  push:
    branches: [remaxhub]
    paths-ignore: ["**/*.md", "docs/**"]

permissions:
  contents: read
  packages: write

concurrency:
  group: remaxhub-images
  cancel-in-progress: false

env:
  WEBAPP_URL: https://book.remaxhub.ae
  API_V2_URL: https://book-api.remaxhub.ae/api/v2

jobs:
  build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: caldiy-web
            dockerfile: ./Dockerfile
          - image: caldiy-api
            dockerfile: ./apps/api/v2/Dockerfile
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af
          df -h /

      - uses: actions/checkout@v4

      - name: Image tags
        id: tags
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          short="${GITHUB_SHA::10}"
          echo "tags=ghcr.io/${owner}/${{ matrix.image }}:sha-${short},ghcr.io/${owner}/${{ matrix.image }}:remaxhub" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          # Only NEXT_PUBLIC_* values are baked into the bundle; runtime secrets come from Coolify env.
          build-args: |
            NEXT_PUBLIC_WEBAPP_URL=${{ env.WEBAPP_URL }}
            NEXT_PUBLIC_API_V2_URL=${{ env.API_V2_URL }}
            NEXT_PUBLIC_LICENSE_CONSENT=agree
            NEXT_PUBLIC_WEBSITE_PRIVACY_POLICY_URL=https://remaxhub.ae/privacy-policy
            CALCOM_TELEMETRY_DISABLED=1
            NEXT_PUBLIC_DISABLE_SIGNUP=true
            NEXT_PUBLIC_APP_NAME=REMAX Hub
            NEXT_PUBLIC_COMPANY_NAME=REMAX Hub
            NEXT_PUBLIC_SUPPORT_MAIL_ADDRESS=hub@remax.ae
            NEXT_PUBLIC_WEBSITE_URL=https://remaxhub.ae
